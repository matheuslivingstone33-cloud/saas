server {
    # IPv4 e IPv6 explicitos. A imagem tem um script de entrypoint que
    # acrescentaria o IPv6 sozinho, mas ele precisa ESCREVER neste arquivo — e
    # com o container rodando sem privilegio ele falha em silencio, so
    # registrando "can not modify ... (read-only file system?)" no log.
    #
    # Sem o IPv6, `wget http://localhost:8080` resolve para [::1], leva
    # "Connection refused" e o healthcheck reprova um nginx que esta servindo
    # normalmente em IPv4.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Rotas publicas do backend na origem do FRONTEND ---------------------
    # O link de descadastro sai como `URL_PUBLICA/descadastro/<token>`, e a
    # URL_PUBLICA e a origem deste nginx (e tambem a origem liberada no CORS e o
    # retorno do Stripe). Sem os blocos abaixo, o coringa de SPA respondia o
    # index.html com status 200: quem clicava em "descadastrar" via a landing e
    # continuava recebendo e-mail. Nenhum erro em log, nenhum teste vermelho —
    # e o guardrail de opt-out de 1 clique quebrado em todo e-mail enviado.
    #
    # `resolver` + variavel faz o nome `backend` ser resolvido a cada 30s, e
    # nao so na subida: um `up -d --build backend` troca o IP do container, e
    # um proxy_pass fixo continuaria mandando para o IP antigo (502).
    # 127.0.0.11 e o DNS interno do Docker. Sem URI no proxy_pass, o caminho
    # original vai inteiro para o backend.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8000;

    location /descadastro/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O token vai no caminho: nao deixar a pagina de resposta ser guardada.
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Pedido de direito do titular (LGPD) — a Politica de Privacidade aponta
    # para `POST /privacidade/solicitacao`.
    location /privacidade/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Politica de privacidade e declaracao de IA em texto.
    location /legal/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: qualquer outra rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

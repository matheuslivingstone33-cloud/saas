<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Descobre, qualifica e inicia conversa com os clientes ideais do seu serviço." />
    <meta name="color-scheme" content="light dark" />
    <title>Prospector AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica o tema salvo ANTES do primeiro pixel. Sem isto, quem escolheu
      // escuro ve um flash branco a cada carregamento.
      (function () {
        try {
          var t = localStorage.getItem("prospector:tema");
          if (t === "claro" || t === "escuro") {
            document.documentElement.setAttribute("data-tema", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
